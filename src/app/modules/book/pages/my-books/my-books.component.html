<section class="my-books-page">
<header class="my-books-page__header"><div><p class="my-books-page__eyebrow"><i class="fa-solid fa-layer-group"></i> YOUR COLLECTION</p><h3>My books</h3><p>Manage the books you own, share, or archive.</p></div>
  <div class="my-books-page__actions">
    <form class="my-books-filters" (ngSubmit)="applyFilters()">
      <label><span>Search by</span><select name="searchParameter" [(ngModel)]="searchParameter"><option value="title">Title</option><option value="authorName">Author</option><option value="isbn">ISBN</option></select></label>
      <label><span>Keyword</span><input name="searchKeyword" type="search" [(ngModel)]="searchKeyword" placeholder="Search books"></label>
      <div class="my-books-filters__actions"><button type="submit" class="my-books-filter-submit"><i class="fa-solid fa-magnifying-glass"></i> Search</button><button type="button" class="my-books-filter-clear" (click)="clearFilters()">Clear</button></div>
    </form>
    <a routerLink="/books/manage" class="btn btn-outline-primary"><i class="fas fa-plus"></i>&nbsp;Add a book</a>
  </div>
</header>
<div class="my-books-grid">
  <app-book-card
    *ngFor="let book of bookResponse.content"
    [book]="book"
    [manage]="true"
    (edit)="editBook($event)"
  ></app-book-card>
</div>
<div class="d-flex justify-content-center mt-3">
  <nav aria-label="Page navigation example">
    <ul class="pagination">
      <li class="page-item">
        <a
          (click)="goToFirstPage()"
          class="page-link"
          href="javascript:void(0)"
          aria-label="Previous"
          [class.disabled]="page === 0"
        >
          <i class="fa-solid fa-angles-left"></i>
        </a>
      </li>
      <li class="page-item">
        <a
          (click)="goToPreviousPage()"
          class="page-link"
          href="javascript:void(0)"
          aria-label="Previous"
          [class.disabled]="page === 0"
        >
          <i class="fa-solid fa-angle-left"></i>
        </a>
      </li>
      <li
        class="page-item"
        *ngFor="let pageIndex of pages"
      >
        <a
          (click)="gotToPage(pageIndex)"
          class="page-link"
          [class.active]="page === pageIndex"
          href="javascript:void(0)"
        >{{ pageIndex + 1 }}</a>
      </li>
      <li class="page-item">
        <a
          (click)="goToNextPage()"
          class="page-link"
          href="javascript:void(0)"
          aria-label="Next"
          [class.disabled]="isLastPage"
        >
          <i class="fa-solid fa-chevron-right"></i>
        </a>
      </li>
      <li class="page-item">
        <a
          (click)="goToLastPage()"
          class="page-link"
          href="javascript:void(0)"
          aria-label="Next"
          [class.disabled]="isLastPage"
        >
          <i class="fa-solid fa-angles-right"></i>
        </a>
      </li>
    </ul>
  </nav>
</div>
</section>
